[build-system]
requires = ["setuptools>=77.0", "wheel", "numpy>=2.2", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pybasicbayes"
version = "0.3.0"
description = "Basic utilities for Bayesian inference"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "Matthew James Johnson", email = "mattjj@csail.mit.edu"}
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = [
    "bayesian",
    "inference",
    "mcmc",
    "variational inference",
    "mean field",
    "vb",
]
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.2",
    "scipy>=1.15",
]

[project.urls]
Homepage = "http://github.com/mattjj/pybasicbayes"
Repository = "http://github.com/mattjj/pybasicbayes"

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "pytest>=8.0",
]

[tool.setuptools]
packages = [
    "pybasicbayes",
    "pybasicbayes.distributions",
    "pybasicbayes.models",
    "pybasicbayes.util",
    "pybasicbayes.testing",
]
